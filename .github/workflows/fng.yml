name: CNN Fear and Greed Alert

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "测试模式：无论指数多少都发送邮件"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cnn-fear-greed-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: python -m pip install --upgrade requests matplotlib

      - name: 检查指数并发送邮件
        env:
          FORCE_SEND: ${{ inputs.force }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PYTHONUNBUFFERED: "1"
        run: python -u fng_alert.py
