```yaml
name: CNN Fear and Greed Alert

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "测试模式：即使未触发阈值也发送邮件"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cnn-fear-greed-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Check index and send email
        env:
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -u fng_alert.py
```
